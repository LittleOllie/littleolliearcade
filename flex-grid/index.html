<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Little Ollie Flex Grid</title>

  <!-- Keep CSP simple and compatible. If you have tighter CSP elsewhere, update connect-src/img-src accordingly -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    base-uri 'self';
    object-src 'none';
    frame-ancestors 'none';
    script-src 'self';
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob: https:;
    connect-src 'self' https:; 
  ">

  <style>
    *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
    body{ margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; background:#0b1020; color:#fff; }
    .wrap{ width:min(1100px, 96vw); margin: 18px auto 28px; }
    h1{ margin: 0 0 10px; font-size: 18px; opacity:.95; }
    .bar{
      display:flex; gap:10px; flex-wrap:wrap; align-items:center;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 14px;
      padding: 10px;
    }
    input, select, button{
      font: inherit;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.22);
      color:#fff;
      padding: 10px 12px;
      outline: none;
    }
    button{
      background: #ffdd55;
      color:#222;
      border: none;
      font-weight: 800;
      cursor:pointer;
    }
    button:disabled{ opacity:.45; cursor:not-allowed; }

    #status{ margin:10px 4px 0; opacity:.9; font-size: 13px; }

    /* wallet chips */
    #walletList{ margin-top:10px; display:none; gap:8px; flex-direction:column; }
    .walletChip{
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
    }
    .walletAddr{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 12px; opacity:.95; }
    .walletMeta{ font-size: 12px; opacity:.75; margin-top:3px; }
    .btnSmall{ padding:8px 10px; border-radius: 12px; background: rgba(255,255,255,.10); color:#fff; }

    /* stage */
    .stage{
      margin-top: 14px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 18px;
      padding: 12px;
      position: relative;
    }
    #stageTitle{ margin: 0 0 6px; font-weight: 900; }
    #stageMeta{ margin: 0 0 10px; opacity:.8; font-size: 13px; }

    /* grid */
    #grid{
      display:grid;
      gap: 6px;
      grid-template-columns: repeat(6, 1fr);
    }
    .tile{
      aspect-ratio: 1/1;
      border-radius: 12px;
      overflow:hidden;
      background: rgba(0,0,0,.20);
      border: 1px solid rgba(255,255,255,.12);
      position: relative;
    }
    .tile img{
      width:100%;
      height:100%;
      object-fit: cover;
      display:block;
    }
    .fillerText{
      width:100%; height:100%;
      display:flex; align-items:center; justify-content:center;
      font-weight: 900;
      opacity:.85;
    }

    /* watermark (DOM overlay) */
    #wmGrid{
      position:absolute;
      left:4px;
      top:4px;
      z-index: 10;
      pointer-events:none;
      padding: 4px 6px;
      border-radius: 10px;
      background: rgba(0,0,0,0.18);
      font-weight: 900;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Little Ollie Flex Grid</h1>

    <div class="bar">
      <input id="walletInput" placeholder="Paste wallet 0x..." inputmode="text" autocapitalize="none" autocomplete="off" spellcheck="false" />
      <button id="addWalletBtn" type="button">➕ Add wallet</button>
      <button id="clearWalletsBtn" type="button">Clear</button>

      <select id="chainSelect">
        <option value="eth">ETH</option>
        <option value="base">Base</option>
        <option value="polygon">Polygon</option>
      </select>

      <button id="loadBtn" type="button" disabled>🔍 Load wallets</button>

      <select id="gridSize">
        <option value="auto">Auto</option>
        <option value="9">9</option>
        <option value="16">16</option>
        <option value="25">25</option>
        <option value="49">49</option>
        <option value="100">100</option>
      </select>

      <button id="buildBtn" type="button" disabled>🧩 Build</button>
      <button id="exportBtn" type="button" disabled>📸 Export PNG</button>
    </div>

    <div id="status"></div>

    <div id="walletList"></div>

    <div class="stage" id="stage">
      <div id="wmGrid">⚡ Powered by Little Ollie Studio</div>
      <p id="stageTitle">Ready</p>
      <p id="stageMeta">Add wallet(s) → Load → Build → Export</p>
      <div id="grid"></div>
    </div>
  </div>

  <script src="./app.js?v=999"></script>
</body>
</html>
